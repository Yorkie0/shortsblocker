<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 320px;
        padding: 16px;
      }
      .toggles {
        display: grid;
        gap: 8px;
        margin: 16px 0 12px;
      }
      #options {
        display: block;
        width: 100%;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
        padding: 6px;
      }
      #options:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/icon128.png" alt="" />
      <div>
        <h1>Shorts Blocker</h1>
        <span>YouTube, minus the noise</span>
      </div>
    </div>

    <div class="toggles">
      <label class="toggle">
        <div>
          <strong>Block Shorts</strong>
          <small>Hide Shorts and open Shorts links as normal videos</small>
        </div>
        <input type="checkbox" class="switch" id="blockShorts" />
      </label>
      <label class="toggle">
        <div>
          <strong>GTA 6 spoiler shield</strong>
          <small>Hide GTA 6 videos, comments &amp; leaks unless they're from Rockstar</small>
        </div>
        <input type="checkbox" class="switch" id="spoilerShield" />
      </label>
    </div>

    <a href="#" id="options">Edit blocked words &amp; allowed channels →</a>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
